const ALLOWED_ACCEPT = ".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv,.png,.jpg,.jpeg,.gif,.webp,.zip,.rar,.mp3,.mp4";

function buildFileGridHtml(p) {
  const files = p.files || [];
  if (!files.length) return `<div class="empty-state" style="padding:32px"><div class="empty-icon">📁</div><div class="empty-title">Aucun fichier</div><div class="empty-desc">Partagez des documents avec l'équipe.</div></div>`;
  return `<div class="file-grid">${files.map(f => {
    const isImg   = (f.mimeType || '').startsWith('image/');
    const isVideo = (f.mimeType || '').startsWith('video/');
    const isAudio = (f.mimeType || '').startsWith('audio/');
    const isPdf   = (f.mimeType || '').includes('pdf');
    const isTxt   = (f.mimeType || '').startsWith('text/') || (f.mimeType || '').includes('json');
    const label   = esc(f.originalName || f.filename);
    const preview = isImg
      ? `<img class="file-preview" src="${f.url}" alt="${label}" loading="lazy" onclick="window.open('${f.url}','_blank')" />`
      : `<div class="file-icon-box">${isVideo ? '🎬' : isAudio ? '🎵' : isPdf ? '📕' : isTxt ? '📝' : '📄'}</div>`;
    return `
      <div class="file-card">
        ${state.user.role === 'boss' ? `<button class="file-delete" onclick="deleteFile('${f.filename}')" title="Supprimer">×</button>` : ''}
        ${preview}
        <div class="file-name"><a href="${f.url}" target="_blank" rel="noopener" title="${label}">${label}</a></div>
        <div class="file-meta">${esc(f.uploadedBy||'')} • ${formatSize(f.size)}</div>
      </div>`;
  }).join('')}</div>`;
}

async function uploadFiles(id) {
  const fileInput = document.getElementById('filesInput');
  if (!fileInput || !fileInput.files || !fileInput.files.length) { notify('warning','Aucun fichier','Sélectionnez au moins un fichier.'); return; }
  const btn  = document.getElementById('filesUploadBtn');
  const track = document.getElementById('filesProgressTrack');
  const bar   = document.getElementById('filesProgressBar');
  const msgEl = document.getElementById('filesMsg');
  if (btn)  btn.disabled = true;
  if (msgEl) msgEl.textContent = '';
  if (track) { track.style.display = ''; bar.style.width = '0%'; }
  try {
    const fd = new FormData();
    for (const f of fileInput.files) fd.append('files', f);
    const res = await new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open('POST', `/api/projects/${id}/files`);
      xhr.onload = () => { const b = (() => { try { return JSON.parse(xhr.responseText); } catch { return {}; } })(); resolve({ok: xhr.status >= 200 && xhr.status < 300, status: xhr.status, body: b}); };
      xhr.onerror = () => reject(new Error('network'));
      xhr.upload.onprogress = e => { if (e.lengthComputable && bar) bar.style.width = Math.round((e.loaded/e.total)*100) + '%'; };
      xhr.send(fd);
    });
    if (!res.ok) { if (msgEl) msgEl.textContent = res.body.error || `Erreur HTTP ${res.status}.`; return; }
    state.currentProject.files = res.body.files;
    markSeen(state.currentProject); saveSeen();
    fileInput.value = '';
    const gridHost = document.getElementById('filesGridHost');
    if (gridHost) gridHost.innerHTML = buildFileGridHtml(state.currentProject);
    notify('success','Téléversement terminé',`${(res.body.files || []).length} fichier(s) enregistré(s).`);
  } catch { if (msgEl) msgEl.textContent = 'Erreur réseau.'; }
  finally {
    if (btn) btn.disabled = false;
    setTimeout(() => { if (track) track.style.display = 'none'; }, 800);
  }
}

async function deleteFile(filename) {
  if (!confirm('Supprimer ce fichier définitivement ?')) return;
  const res = await fetch(`/api/projects/${pId()}/files/${encodeURIComponent(filename)}`, { method:'DELETE' });
  if (!res.ok) { const d = await res.json().catch(() => ({})); notify('error','Erreur',d.error || `HTTP ${res.status}`); return; }
  const data = await res.json();
  state.currentProject.files = data.files;
  const gridHost = document.getElementById('filesGridHost');
  if (gridHost) gridHost.innerHTML = buildFileGridHtml(state.currentProject);
  notify('success','Fichier supprimé','Le fichier a bien été supprimé.');
}

/* =====================================================================
   ACTION HANDLERS
   ===================================================================== */
async function acceptProject(id) {
  const res = await fetch(`/api/projects/${id}/accept`, { method:'POST' });
  if (!res.ok) { const d = await res.json().catch(() => ({})); notify('error','Erreur',d.error || `HTTP ${res.status}`); return; }
  state.currentProject = await res.json();
  notify('success','Projet accepté','Vous pouvez soumettre votre travail.', { projectId:id, tab:'rapport' });
  renderProjectDetail();
}

async function doArchiveProject(id) {
  if (!confirm('Archiver ce projet ?')) return;
  const res = await fetch(`/api/projects/${id}/archive`, { method:'POST' });
  if (!res.ok) { const d = await res.json().catch(() => ({})); notify('error','Erreur',d.error || `HTTP ${res.status}`); return; }
  notify('info','Projet archivé','Le projet a été déplacé dans les archives.');
  closeProject();
}

async function deleteProject(id, archived) {
  const label = String(archived) === 'true' ? 'supprimer définitivement cet archivage' : 'supprimer définitivement ce projet et ses fichiers';
  if (!confirm(`Êtes-vous sûr de vouloir ${label} ?`)) return;
  const res = await fetch(`/api/projects/${id}`, { method:'DELETE' });
  if (!res.ok) { const d = await res.json().catch(() => ({})); notify('error','Erreur',d.error || `HTTP ${res.status}`); return; }
  notify('warning','Projet supprimé','Le projet a été supprimé.');
  closeProject();
}

/* Edit cahier */
function openEditCahierModal(id) {
  const p = state.currentProject;
  openModal(`
    <div class="modal-title">✏️ Modifier le cahier de charge</div>
    <div class="form-field">
      <label class="form-label">Contenu</label>
      <textarea class="form-textarea" id="editCahier" rows="10">${esc(p.description || '')}</textarea>
    </div>
    <div class="modal-error" id="editCahierErr"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary-sm" onclick="closeModal()">Annuler</button>
      <button class="btn btn-primary-sm" onclick="saveCahier(${id})">Enregistrer</button>
    </div>
  `);
}
async function saveCahier(id) {
  const desc = document.getElementById('editCahier').value.trim();
  const errEl = document.getElementById('editCahierErr');
  if (!desc) { errEl.textContent = 'Le cahier ne peut pas être vide.'; return; }
  const res = await fetch(`/api/projects/${id}`, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ name:state.currentProject.name, description:desc }) });
  if (!res.ok) { errEl.textContent = (await res.json()).error || 'Erreur.'; return; }
  state.currentProject = await res.json();
  closeModal();
  renderProjectDetail();
  notify('success','Cahier mis à jour','Les assignés seront notifiés.', { projectId:id, tab:'cahier' });
}

/* Assignees modal */
async function openAssigneesModal(id) {
  if (!state.employees.length) { const r = await fetch('/api/users'); state.employees = r.ok ? await r.json() : []; }
  if (!state.employees.length) { notify('warning','Aucun employé','Aucun compte employé disponible.'); return; }
  const p       = state.currentProject;
  const current = p.assignedEmployees || p.assigned_employees || [];
  openModal(`
    <div class="modal-title">👥 Gérer les assignés</div>
    <p class="modal-help">Les soumissions des employés retirés seront supprimées.</p>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
      <label class="form-label" style="margin:0">Sélection</label>
      <div class="assign-controls">
        <button class="btn btn-secondary-sm" style="padding:5px 10px;font-size:0.72rem" onclick="asgAll(true)">Tout</button>
        <button class="btn btn-secondary-sm" style="padding:5px 10px;font-size:0.72rem" onclick="asgAll(false)">Aucun</button>
      </div>
    </div>
    <input class="form-input" id="asg-search" placeholder="Filtrer…" oninput="asgFilter()" style="margin-bottom:8px" />
    <div class="assign-list" id="asg-list">
      ${state.employees.map(u => `<label data-u="${esc(u.username)}"><input type="checkbox" class="asg-cb" value="${esc(u.username)}" ${current.includes(u.username)?'checked':''} /> ${esc(u.username)}</label>`).join('')}
    </div>
    <div class="modal-error" id="asg-err"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary-sm" onclick="closeModal()">Annuler</button>
      <button class="btn btn-primary-sm" onclick="submitAssignees(${id})">Enregistrer</button>
    </div>
  `);
}
function asgAll(v)   { document.querySelectorAll('.asg-cb').forEach(c => { if (c.closest('label').style.display !== 'none') c.checked = v; }); }
function asgFilter() { const q = (document.getElementById('asg-search').value || '').toLowerCase(); document.querySelectorAll('#asg-list label').forEach(l => { l.style.display = (q==='' || (l.getAttribute('data-u')||'').toLowerCase().includes(q)) ? '' : 'none'; }); }

async function submitAssignees(id) {
  const assignees = [...document.querySelectorAll('.asg-cb:checked')].map(c => c.value);
  const errEl = document.getElementById('asg-err');
  if (!assignees.length) { errEl.textContent = 'Au moins un assigné est requis.'; return; }
  const res = await fetch(`/api/projects/${id}/assignees`, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ assignees }) });
  const data = await res.json();
  if (!res.ok) { errEl.textContent = data.error || 'Erreur.'; return; }
  state.currentProject = { ...state.currentProject, ...data };
  closeModal();
  renderProjectDetail();
  if (data._meta) {
    const added   = (data._meta.added || []).join(', ');
    const removed = (data._meta.removed || []).join(', ');
    if (added)   notify('success','Assignés','Ajouté(s) : ' + added);
    if (removed) notify('warning','Assignés','Retiré(s) : ' + removed);
    if (!added && !removed) notify('info','Aucun changement','La liste est inchangée.');
  }
}

/* Submit modal */
function openSubmitModal(id) {
  openModal(`
    <div class="modal-title">📤 Soumettre un document</div>
    <div class="form-field">
      <label class="form-label">Type de soumission</label>
      <select class="form-select" id="subType">
        <option value="devis">Devis</option>
        <option value="cahier">Cahier de charges</option>
        <option value="rapport">Rapport</option>
      </select>
    </div>
    <div class="form-field">
      <label class="form-label">Description</label>
      <textarea class="form-textarea" id="subText" rows="4" placeholder="Détails de la soumission…"></textarea>
    </div>
    <div class="form-field">
      <label class="form-label">Pièce jointe (optionnelle)</label>
      <input type="file" id="subFile" accept=".pdf,.doc,.docx,.png,.jpg,.jpeg,.gif,.webp,.svg" onclick="state.choosingFile = true" />
    </div>
    <div class="modal-error" id="subErr"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary-sm" onclick="closeModal()">Annuler</button>
      <button class="btn btn-primary-sm" onclick="submitSubmission(${id})">Envoyer</button>
    </div>
  `);
}
async function submitSubmission(id) {
  const type = document.getElementById('subType').value;
  const text = document.getElementById('subText').value.trim();
  const fileInput = document.getElementById('subFile');
  const fd = new FormData();
  fd.append('type', type);
  fd.append('text', text);
  if (fileInput.files.length > 0) fd.append('attachment', fileInput.files[0]);
  const res = await fetch(`/api/projects/${id}/submit`, { method:'POST', body: fd });
  const data = await res.json();
  if (!res.ok) { document.getElementById('subErr').textContent = data.error || 'Erreur.'; return; }
  state.currentProject.submissions = (state.currentProject.submissions || []).concat([data]);
  markSeen(state.currentProject); saveSeen();
  closeModal();
  renderProjectDetail();
  notify('success','Soumission envoyée','Votre travail a été transmis au manager.');
}

/* =====================================================================
   POLLING  — BUG FIX: don't fire unseen toasts on every poll
   ===================================================================== */
function startPolling() {
  stopPolling();
  state.poller = setInterval(refreshProject, POLL_MS);
  refreshProject();
}
function startSoftPolling() {
  stopPolling();
  state.poller = setInterval(softPoll, SOFT_MS);
}
function stopPolling() {
  if (state.poller) { clearInterval(state.poller); state.poller = null; }
}

async function softPoll() {
  // Just refresh the project list data; DO NOT fire more unseen toasts
  try {
    if (state.user.role === 'boss') {
      const [a, b] = await Promise.all([
        fetch('/api/users').then(r => r.ok ? r.json() : state.employees),
        fetch('/api/projects').then(r => r.ok ? r.json() : state.projects)
      ]);
      state.employees = a;
      state.projects  = b;
    } else {
      const r = await fetch('/api/projects');
      if (r.ok) state.projects = await r.json();
    }
    renderProjectsList();
  } catch { /* ignore */ }
}

async function refreshProject() {
  if (!state.currentProject) return;
  const id = state.currentProject.id;
  try {
    const [pRes, mRes] = await Promise.all([
      fetch(`/api/projects/${id}`),
      fetch(`/api/projects/${id}/messages`)
    ]);
    if (!pRes.ok) return;
    const prev = state.currentProject;
    const p    = await pRes.json();
    const msgs = mRes.ok ? await mRes.json() : (p.messages || []);

    // Notifications for changes since last render (within this detail view)
    const prevCahier = prev.cahierUpdatedAt || prev.cahier_updated_at;
    const nextCahier = p.cahierUpdatedAt   || p.cahier_updated_at;
    if (prevCahier !== nextCahier) notify('project','Cahier mis à jour','Le cahier a été modifié.', {projectId:id, tab:'cahier'});
    if ((p.submissions || []).length > (prev.submissions || []).length) notify('project','Nouvelle soumission',`${(p.submissions||[]).length - (prev.submissions||[]).length} soumission(s) reçue(s).`,{projectId:id,tab:'rapport'});
    if ((p.files      || []).length > (prev.files      || []).length) notify('project','Nouveau document',`${(p.files||[]).length - (prev.files||[]).length} fichier(s) ajouté(s).`,{projectId:id,tab:'files'});
    if (msgs.length > state.messages.length) notify('project','Nouveau message',`${msgs.length - state.messages.length} message(s) reçu(s).`,{projectId:id,tab:'messages'});

    state.currentProject = p;
    state.messages = msgs;
    markSeen(p); saveSeen();

    if (state.subTab === 'files') {
      const host = document.getElementById('filesGridHost');
      if (host) host.innerHTML = buildFileGridHtml(p);
    } else if (state.subTab === 'messages') {
      const list = document.getElementById('messagesList');
      if (list && msgs.length !== list.querySelectorAll('.msg-bubble').length) {
        list.innerHTML = msgs.map(m => msgBubbleHtml(m)).join('');
        scrollMsgs();
      }
    } else if (state.subTab === 'rapport') {
      const host = document.getElementById('subTabContent');
      if (host && !state.choosingFile) renderRapport(host);
    } else if (state.subTab === 'cahier') {
      const descEl = document.getElementById('projectDescText');
      if (descEl) descEl.textContent = p.description || '';
    }
  } catch { /* ignore transient */ }
}

/* =====================================================================
   BOOT
   ===================================================================== */
window.addEventListener('focus', () => { state.choosingFile = false; });
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(err => console.warn('SW registration failed:', err));
  });
}
init();
</script>
