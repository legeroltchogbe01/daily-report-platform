<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Super Admin Portal — Daily Report Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-dark: #090d16;
      --bg-card: #111827;
      --bg-deep: #05080f;
      --primary: #6366f1;
      --primary-light: #818cf8;
      --emerald: #10b981;
      --emerald-light: #34d399;
      --danger: #ef4444;
      --text-1: #f9fafb;
      --text-2: #9ca3af;
      --text-3: #6b7280;
      --glass-border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-dark);
      color: var(--text-1);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: rgba(17, 24, 39, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--glass-border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text-1);
    }
    .brand-logo {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--primary), var(--emerald));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      font-weight: 800;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.3);
    }
    .brand-title { font-family: 'Outfit', sans-serif; font-size: 1.15rem; font-weight: 800; }
    .brand-subtitle { font-size: 0.72rem; color: var(--emerald-light); font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; }
    .btn {
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      border: 1px solid transparent;
      transition: all 150ms ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-secondary { background: rgba(255,255,255,0.05); color: var(--text-1); border-color: var(--glass-border); }
    .btn-secondary:hover { background: rgba(255,255,255,0.1); }
    .btn-danger { background: rgba(239, 68, 68, 0.15); color: var(--danger); border-color: rgba(239, 68, 68, 0.3); }
    .btn-danger:hover { background: rgba(239, 68, 68, 0.25); }
    main {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 32px 24px;
    }
    .page-title-box { margin-bottom: 32px; }
    .page-title { font-family: 'Outfit', sans-serif; font-size: 1.8rem; font-weight: 800; }
    .page-sub { color: var(--text-2); font-size: 0.9rem; margin-top: 4px; }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }
    .kpi-card {
      background: var(--bg-card);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 22px;
      position: relative;
      overflow: hidden;
    }
    .kpi-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 3px;
      background: var(--card-accent, var(--primary));
    }
    .kpi-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .kpi-label { font-size: 0.8rem; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.04em; }
    .kpi-icon { font-size: 1.5rem; }
    .kpi-val { font-size: 2.2rem; font-weight: 800; font-family: 'Outfit', sans-serif; color: var(--text-1); line-height: 1; }
    .kpi-desc { font-size: 0.78rem; color: var(--text-2); margin-top: 8px; }

    .panel {
      background: var(--bg-card);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 32px;
    }
    .panel-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; }
    
    .table-responsive { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.88rem; }
    th { padding: 12px 16px; border-bottom: 1px solid var(--glass-border); color: var(--text-3); font-weight: 600; font-size: 0.75rem; text-transform: uppercase; }
    td { padding: 14px 16px; border-bottom: 1px solid rgba(255,255,255,0.03); color: var(--text-2); }
    tr:hover td { background: rgba(255,255,255,0.02); }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .badge-boss { background: rgba(99, 102, 241, 0.15); color: var(--primary-light); border: 1px solid rgba(99, 102, 241, 0.3); }
    .badge-employee { background: rgba(16, 185, 129, 0.15); color: var(--emerald-light); border: 1px solid rgba(16, 185, 129, 0.3); }

    .loading { text-align: center; padding: 60px 0; color: var(--text-3); }
  </style>
</head>
<body>

  <header>
    <a href="/" class="brand">
      <div class="brand-logo">⚡</div>
      <div>
        <div class="brand-title">Super Admin Portal</div>
        <div class="brand-subtitle">Gestionnaire Global de la Plateforme</div>
      </div>
    </a>
    <div style="display: flex; gap: 10px;">
      <a href="/" class="btn btn-secondary">🏠 Aller au Dashboard</a>
      <button class="btn btn-danger" onclick="resetPlatform()">💥 Reset Plateforme</button>
    </div>
  </header>

  <main>
    <div class="page-title-box">
      <h1 class="page-title">Statistiques & Vue d'Ensemble Globale</h1>
      <p class="page-sub">Métriques en temps réel des utilisateurs, entreprises et contenus hébergés sur la plateforme.</p>
    </div>

    <div id="statsContent">
      <div class="loading">Chargement des données en temps réel…</div>
    </div>
  </main>

  <script>
    async function loadAdminData() {
      const container = document.getElementById('statsContent');
      try {
        const res = await fetch('/api/admin/stats');
        if (!res.ok) {
          container.innerHTML = `
            <div class="panel" style="text-align:center; padding:60px 20px;">
              <div style="font-size:3rem; margin-bottom:12px;">🔒</div>
              <h2 style="margin-bottom:8px;">Accès Réservé aux Administrateurs</h2>
              <p style="color:var(--text-3); margin-bottom:20px;">Veuillez vous connecter avec le compte administrateur principal.</p>
              <a href="/" class="btn btn-secondary">Connexion</a>
            </div>`;
          return;
        }

        const s = await res.json();
        const bossPct = s.totalUsers > 0 ? Math.round((s.bossCount / s.totalUsers) * 100) : 0;
        const empPct = s.totalUsers > 0 ? Math.round((s.employeeCount / s.totalUsers) * 100) : 0;

        container.innerHTML = `
          <!-- KPI Cards Grid -->
          <div class="kpi-grid">
            <div class="kpi-card" style="--card-accent: #6366f1;">
              <div class="kpi-header">
                <span class="kpi-label">Entreprises / Boss</span>
                <span class="kpi-icon">👔</span>
              </div>
              <div class="kpi-val">${s.bossCount}</div>
              <div class="kpi-desc">Manager(s) enregistrés</div>
            </div>

            <div class="kpi-card" style="--card-accent: #10b981;">
              <div class="kpi-header">
                <span class="kpi-label">Employés</span>
                <span class="kpi-icon">👷</span>
              </div>
              <div class="kpi-val">${s.employeeCount}</div>
              <div class="kpi-desc">Comptes d'employés inscrits</div>
            </div>

            <div class="kpi-card" style="--card-accent: #3b82f6;">
              <div class="kpi-header">
                <span class="kpi-label">Projets Créés</span>
                <span class="kpi-icon">📁</span>
              </div>
              <div class="kpi-val">${s.totalProjects}</div>
              <div class="kpi-desc">${s.activeProjects} actifs · ${s.archivedProjects} archivés</div>
            </div>

            <div class="kpi-card" style="--card-accent: #f59e0b;">
              <div class="kpi-header">
                <span class="kpi-label">Rapports Déposés</span>
                <span class="kpi-icon">📋</span>
              </div>
              <div class="kpi-val">${s.totalReports}</div>
              <div class="kpi-desc">${s.totalComments} commentaire(s) associés</div>
            </div>

            <div class="kpi-card" style="--card-accent: #a78bfa;">
              <div class="kpi-header">
                <span class="kpi-label">Messages Échangés</span>
                <span class="kpi-icon">💬</span>
              </div>
              <div class="kpi-val">${s.totalMessages}</div>
              <div class="kpi-desc">Dans la messagerie des projets</div>
            </div>

            <div class="kpi-card" style="--card-accent: #ec4899;">
              <div class="kpi-header">
                <span class="kpi-label">Fichiers Hébergés</span>
                <span class="kpi-icon">📎</span>
              </div>
              <div class="kpi-val">${s.totalFiles}</div>
              <div class="kpi-desc">Documents, images & médias</div>
            </div>
          </div>

          <!-- User Distribution Panel -->
          <div class="panel">
            <div class="panel-title">
              <span>Répartition globale des Utilisateurs (${s.totalUsers} au total)</span>
            </div>
            <div style="height:14px; width:100%; background:rgba(255,255,255,0.05); border-radius:7px; overflow:hidden; display:flex; margin-bottom:12px;">
              <div style="width:${bossPct}%; background:linear-gradient(90deg, #6366f1, #818cf8);" title="Managers: ${s.bossCount} (${bossPct}%)"></div>
              <div style="width:${empPct}%; background:linear-gradient(90deg, #10b981, #34d399);" title="Employés: ${s.employeeCount} (${empPct}%)"></div>
            </div>
            <div style="display:flex; gap:24px; font-size:0.82rem; color:var(--text-2);">
              <span style="display:flex; align-items:center; gap:8px;"><span style="width:10px; height:10px; background:#6366f1; border-radius:50%;"></span> Boss / Managers : <strong>${s.bossCount}</strong> (${bossPct}%)</span>
              <span style="display:flex; align-items:center; gap:8px;"><span style="width:10px; height:10px; background:#10b981; border-radius:50%;"></span> Employés : <strong>${s.employeeCount}</strong> (${empPct}%)</span>
            </div>
          </div>

          <!-- Registered Users Table -->
          <div class="panel">
            <div class="panel-title">
              <span>Registre Complet des Comptes Utilisateurs (${(s.userList||[]).length})</span>
            </div>
            <div class="table-responsive">
              <table>
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Nom d'utilisateur</th>
                    <th>Rôle / Statut</th>
                    <th>Matricule</th>
                  </tr>
                </thead>
                <tbody>
                  ${(s.userList || []).map(u => `
                    <tr>
                      <td style="font-family:monospace; color:var(--text-3);">#${u.id}</td>
                      <td style="font-weight:700; color:var(--text-1);">${u.username}</td>
                      <td>
                        <span class="badge ${u.role === 'boss' ? 'badge-boss' : 'badge-employee'}">
                          ${u.role === 'boss' ? '👔 Boss / Manager' : '👷 Employé'}
                        </span>
                      </td>
                      <td style="font-family:monospace; color:${u.matricule?'var(--emerald-light)':'var(--text-3)'};">
                        ${u.matricule || '—'}
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      } catch (err) {
        container.innerHTML = `<div class="panel" style="color:var(--danger)">Erreur lors du chargement des statistiques.</div>`;
      }
    }

    function resetPlatform() {
      if (confirm('⚠️ ATTENTION : Êtes-vous sûr de vouloir remettre à zéro TOUTES les données de la plateforme (projets, messages, utilisateurs) ?')) {
        window.location.href = '/api/admin/reset-db';
      }
    }

    loadAdminData();
  </script>
</body>
</html>
