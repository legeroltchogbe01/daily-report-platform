services:
  - type: web
    name: daily-report-platform
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: daily-report-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: STORAGE_PROVIDER
        value: cloudinary
      - key: CLOUDINARY_URL
        sync: false # User can set this in the Render dashboard

databases:
  - name: daily-report-db
    plan: free
